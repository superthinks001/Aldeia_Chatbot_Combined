# ============================================
# ALDEIA CHATBOT - PRODUCTION DOCKER COMPOSE
# ============================================
# This file orchestrates backend, frontend, and nginx services for production
#
# PREREQUISITES:
# - Redis must be running (use scripts/deployment/deploy-redis.sh)
# - ChromaDB must be running (use scripts/deployment/deploy-chromadb.sh)
# - Supabase must be accessible
# - SSL certificates must be configured in nginx/ssl/
#
# Make sure to configure .env.production before deployment
# ============================================

services:
  # ============================================
  # BACKEND API SERVICE
  # ============================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER:-superthinks001/aldeia_chatbot_combined}/backend:latest
    container_name: aldeia-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-30d}
      # ChromaDB - connects to standalone container
      - CHROMA_HOST=${CHROMA_HOST:-aldeia-chromadb}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN}
      # Redis - connects to standalone container
      - REDIS_URL=${REDIS_URL:-redis://aldeia-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - aldeia-network
    volumes:
      - ./logs/backend:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # CHATBOT FRONTEND SERVICE
  # ============================================
  chatbot-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER:-superthinks001/aldeia_chatbot_combined}/chatbot-frontend:latest
    container_name: aldeia-chatbot-frontend
    restart: unless-stopped
    ports:
      - "3000:3002"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=${BACKEND_URL:-https://api.aldeia.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - aldeia-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================
  # REBUILD PLATFORM SERVICE (Optional)
  # ============================================
  # NOTE: This service is referenced in nginx configuration but not yet implemented
  # Uncomment when rebuild-platform is ready for deployment
  # rebuild-platform:
  #   build:
  #     context: ./apps/rebuild-platform
  #     dockerfile: Dockerfile
  #   container_name: aldeia-rebuild-platform
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #     - BACKEND_URL=${BACKEND_URL}
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1'
  #         memory: 1G
  #   networks:
  #     - aldeia-network

  # ============================================
  # NGINX REVERSE PROXY SERVICE
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: aldeia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - chatbot-frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - aldeia-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================
  # CERTBOT (Let's Encrypt SSL) - Optional
  # ============================================
  # Uncomment to enable automatic SSL certificate management
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: aldeia-certbot
  #   volumes:
  #     - ./nginx/ssl:/etc/letsencrypt
  #     - certbot-webroot:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - aldeia-network

  # ============================================
  # MONITORING - PROMETHEUS (Optional)
  # ============================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: aldeia-prometheus
  #   restart: unless-stopped
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--storage.tsdb.retention.time=200h'
  #     - '--web.enable-lifecycle'
  #   networks:
  #     - aldeia-network
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "5m"
  #       max-file: "2"

  # ============================================
  # MONITORING - GRAFANA (Optional)
  # ============================================
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: aldeia-grafana
  #   restart: unless-stopped
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
  #   networks:
  #     - aldeia-network
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "5m"
  #       max-file: "2"

# ============================================
# NETWORKS
# ============================================
networks:
  aldeia-network:
    external: true
    name: aldeia-network

# ============================================
# VOLUMES
# ============================================
volumes:
  certbot-webroot:
    driver: local
  # prometheus-data:
  #   driver: local
  # grafana-data:
  #   driver: local

# ============================================
# DEPLOYMENT INSTRUCTIONS:
# ============================================
# PREREQUISITES - Run these FIRST on the server:
#
# 1. Deploy infrastructure services (run once):
#    export REDIS_PASSWORD='your-redis-password'
#    export CHROMA_AUTH_TOKEN='your-chroma-token'
#    ./scripts/deployment/deploy-redis.sh start
#    ./scripts/deployment/deploy-chromadb.sh start
#
# 2. Verify infrastructure is healthy:
#    ./scripts/deployment/deploy-redis.sh status
#    ./scripts/deployment/deploy-chromadb.sh status
#
# 3. Generate SSL certificates:
#    - Option A: Let's Encrypt (recommended for production)
#      docker-compose -f docker-compose.production.yml run --rm certbot certonly --webroot --webroot-path=/var/www/certbot -d api.aldeia.com -d chat.aldeia.com
#    - Option B: Self-signed (for testing)
#      mkdir -p nginx/ssl
#      openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem
#
# 4. Copy .env.production to .env and configure all variables
#
# 5. Start services:
#    docker-compose -f docker-compose.production.yml up -d
#
# 6. Check logs:
#    docker-compose -f docker-compose.production.yml logs -f
#
# 7. Verify health:
#    docker-compose -f docker-compose.production.yml ps
#
# 8. Monitor:
#    docker stats
#
# SCALING:
# - Scale backend: docker-compose -f docker-compose.production.yml up -d --scale backend=3
# - Update service: docker-compose -f docker-compose.production.yml up -d --no-deps --build backend
#
# BACKUP:
# - Redis: ./scripts/deployment/deploy-redis.sh backup ./backups
# - ChromaDB: ./scripts/deployment/deploy-chromadb.sh backup ./backups
#
# SECURITY:
# - Regularly update images: docker-compose -f docker-compose.production.yml pull
# - Monitor logs for suspicious activity
# - Rotate secrets regularly
# - Use firewall rules to restrict access
# ============================================
