name: CD - Deploy

# ============================================
# CONTINUOUS DEPLOYMENT WORKFLOW
# ============================================
# Deploys to staging on development branch
# Deploys to production on main branch
# Builds and pushes Docker images to registry
# Deploys via SSH to target server
# ============================================

on:
  push:
    branches: [main, development]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'merge-docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io

jobs:
  # ============================================
  # DETERMINE ENVIRONMENT
  # ============================================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      compose_file: ${{ steps.set-env.outputs.compose_file }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.environment }}" == "production" ]; then
              echo "compose_file=docker-compose.production.yml" >> $GITHUB_OUTPUT
            else
              echo "compose_file=docker-compose.staging.yml" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.production.yml" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.staging.yml" >> $GITHUB_OUTPUT
          fi

      - name: Display deployment info
        run: |
          echo "🚀 Deploying to: ${{ steps.set-env.outputs.environment }}"
          echo "📄 Using compose file: ${{ steps.set-env.outputs.compose_file }}"

  # ============================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, chatbot-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name to lowercase
        id: image-name
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWER }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/development' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  # ============================================
  # DEPLOY TO TARGET ENVIRONMENT
  # ============================================
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cat > .env.${{ needs.setup.outputs.environment }} << EOF
          NODE_ENV=${{ needs.setup.outputs.environment }}
          GITHUB_REPOSITORY_LOWER=${REPO_LOWER}
          BACKEND_PORT=3001
          CHATBOT_FRONTEND_PORT=3000

          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRATION=24h
          JWT_REFRESH_EXPIRATION=30d

          BACKEND_URL=http://${{ secrets.SERVER_HOST }}:3001
          FRONTEND_CHAT_URL=http://${{ secrets.SERVER_HOST }}:3000

          CHROMA_HOST=chromadb
          CHROMA_PORT=8000
          CHROMA_AUTH_TOKEN=${{ secrets.CHROMA_AUTH_TOKEN }}

          REDIS_URL=redis://redis:6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          GOOGLE_TRANSLATE_API_KEY=${{ secrets.GOOGLE_TRANSLATE_API_KEY }}

          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          LOG_LEVEL=${{ needs.setup.outputs.environment == 'production' && 'info' || 'debug' }}
          ENABLE_MONITORING=true

          ENABLE_VOICE_INPUT=true
          ENABLE_MULTILINGUAL=true
          ENABLE_BILLING=true
          USE_SQLITE=false

          CORS_ORIGINS=http://${{ secrets.SERVER_HOST }}:3000,http://${{ secrets.SERVER_HOST }}:3001,http://localhost:3000

          RATE_LIMIT_WINDOW=15
          RATE_LIMIT_MAX_REQUESTS=100

          SESSION_SECRET=${{ secrets.SESSION_SECRET }}

          HEALTH_CHECK_INTERVAL=30000
          HEALTH_CHECK_TIMEOUT=5000
          EOF

      - name: Install Docker on server (if not already installed)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            # Check if Docker is installed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo usermod -aG docker $USER
              echo "Docker installed successfully"
            else
              echo "Docker is already installed"
            fi

            # Check if Docker Compose is installed
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              echo "Docker Compose installed successfully"
            else
              echo "Docker Compose is already installed"
            fi
          EOF

      - name: Login to GitHub Container Registry on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          EOF

      - name: Copy files to server
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          COMPOSE_FILE: ${{ needs.setup.outputs.compose_file }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ~/aldeia"
          scp ${{ needs.setup.outputs.compose_file }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/aldeia/
          scp -r nginx ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/aldeia/ || echo "No nginx directory to copy"
          scp .env.${{ needs.setup.outputs.environment }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/aldeia/.env

      - name: Deploy on server
        env:
          COMPOSE_FILE: ${{ needs.setup.outputs.compose_file }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd ~/aldeia

            # Pull latest images
            docker compose -f ${{ needs.setup.outputs.compose_file }} pull

            # Stop old containers
            docker compose -f ${{ needs.setup.outputs.compose_file }} down

            # Start new containers
            docker compose -f ${{ needs.setup.outputs.compose_file }} up -d

            # Wait for health checks
            echo "Waiting for services to be healthy..."
            sleep 30

            # Check service health
            docker compose -f ${{ needs.setup.outputs.compose_file }} ps

            # Show logs
            docker compose -f ${{ needs.setup.outputs.compose_file }} logs --tail=50
          EOF

      - name: Run database migrations
        env:
          COMPOSE_FILE: ${{ needs.setup.outputs.compose_file }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd ~/aldeia
            docker compose -f ${{ needs.setup.outputs.compose_file }} exec -T backend npm run migrate || echo "Migrations not configured"
          EOF

      - name: Verify deployment
        run: |
          # Wait for services to stabilize
          sleep 10

          # Check backend health
          curl -f http://${{ secrets.SERVER_HOST }}:3001/api/health || exit 1

          # Check frontend
          curl -f http://${{ secrets.SERVER_HOST }}:3000/ || exit 1

          echo "✅ Deployment verification successful!"

      - name: Rollback on failure
        if: failure()
        env:
          COMPOSE_FILE: ${{ needs.setup.outputs.compose_file }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd ~/aldeia
            echo "⚠️ Deployment failed, attempting rollback..."
            docker compose -f ${{ needs.setup.outputs.compose_file }} down
            docker compose -f ${{ needs.setup.outputs.compose_file }} up -d
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to ${{ needs.setup.outputs.environment }} successful!"
          else
            echo "❌ Deployment to ${{ needs.setup.outputs.environment }} failed!"
          fi

  # ============================================
  # POST-DEPLOYMENT CHECKS
  # ============================================
  post-deployment-checks:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "Running smoke tests for ${{ needs.setup.outputs.environment }}..."

          # Test backend health
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}:3001/api/health)
          if [ "$response" != "200" ]; then
            echo "❌ Backend health check failed (HTTP $response)"
            exit 1
          fi
          echo "✅ Backend health check passed"

          # Test frontend
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}:3000/)
          if [ "$response" != "200" ]; then
            echo "❌ Frontend check failed (HTTP $response)"
            exit 1
          fi
          echo "✅ Frontend check passed"

          echo "✅ All smoke tests passed!"

      - name: Performance check
        run: |
          echo "Checking API response times..."
          time curl -s http://${{ secrets.SERVER_HOST }}:3001/api/health > /dev/null
          echo "✅ Performance check completed"

  # ============================================
  # CLEANUP OLD IMAGES
  # ============================================
  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [setup, post-deployment-checks]
    if: success()
    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Cleanup on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            # Remove dangling images
            docker image prune -af --filter "until=24h"

            # Remove old containers
            docker container prune -f

            echo "✅ Cleanup completed"
          EOF

# ============================================
# REQUIRED GITHUB SECRETS (per environment):
# ============================================
# Create environments: staging, production
# Each environment needs these secrets:
#
# SSH_PRIVATE_KEY - SSH private key for server access
# SERVER_HOST - Server hostname/IP
# SERVER_USER - SSH username for server
# SUPABASE_URL - Supabase project URL
# SUPABASE_ANON_KEY - Supabase anon key
# SUPABASE_SERVICE_ROLE_KEY - Supabase service role key
# DATABASE_URL - PostgreSQL connection string
# JWT_SECRET - JWT signing secret
# JWT_REFRESH_SECRET - JWT refresh token secret
# CHROMA_AUTH_TOKEN - ChromaDB authentication token
# REDIS_PASSWORD - Redis password
# STRIPE_SECRET_KEY - Stripe secret key
# STRIPE_PUBLISHABLE_KEY - Stripe publishable key
# STRIPE_WEBHOOK_SECRET - Stripe webhook secret
# GOOGLE_TRANSLATE_API_KEY - Google Translate API key
# SENTRY_DSN - Sentry error tracking DSN
# SESSION_SECRET - Session secret
# ============================================
